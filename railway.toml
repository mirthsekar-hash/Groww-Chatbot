# https://docs.railway.com/reference/config-as-code
# Backend lives at repository root (FastAPI `src.chat_app:app`), not in `backend/`.
[build]
builder = "nixpacks"
# Let Nixpacks install deps from requirements.txt (no custom pip command — avoids exit 127).

[deploy]
startCommand = "python -m uvicorn src.chat_app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
